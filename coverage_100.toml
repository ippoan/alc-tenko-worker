# 行カバレッジ 100% の登録簿 (ippoan/alc-devices-worker の同名のファイルの形。Refs ippoan/rust-alc-api#680)。
#
#   bash scripts/fetch-migrations.sh
#   TENKO_TEST_ADMIN_DATABASE_URL=... cargo llvm-cov --locked -p tenko --text > cov-tenko.txt
#   bash scripts/check_coverage_100.sh --use-cache cov-tenko.txt
#
# 計測するのは `cargo test -p tenko` の全部 = 各 module の単体テストと tests/*_db.rs (実 DB)。
# worker 本体 (直下の src/、wasm 専用) は native で計測できないので対象外。

# 口の組み立て・dev の軸の部品
[[files]]
path = "crates/tenko/src/lib.rs"

# 行の型・列・頁 (全部の口が使う)
[[files]]
path = "crates/tenko/src/models.rs"

# 点呼の記録の一覧・CSV (tests/records_db.rs)
[[files]]
path = "crates/tenko/src/records.rs"

# 点呼の予定 (tests/schedules_db.rs)
[[files]]
path = "crates/tenko/src/schedules.rs"

# 点呼の設定 (tests/schedules_db.rs)
[[files]]
path = "crates/tenko/src/settings.rs"

# ダッシュボード (tests/schedules_db.rs)
[[files]]
path = "crates/tenko/src/dashboard.rs"

# 健康の基準値 (tests/admin_db.rs)
[[files]]
path = "crates/tenko/src/baselines.rs"

# 機器故障 (tests/admin_db.rs)
[[files]]
path = "crates/tenko/src/failures.rs"

# webhook の設定と配信の記録 (tests/admin_db.rs)
[[files]]
path = "crates/tenko/src/webhooks.rs"

# 日々の健康状態 (tests/views_db.rs)
[[files]]
path = "crates/tenko/src/daily_health.rs"

# 乗務員情報 (tests/views_db.rs。任意の項目の失敗は読み取り専用のロールで通す)
[[files]]
path = "crates/tenko/src/driver_info.rs"

# 点呼の電話 (tests/call_db.rs)
[[files]]
path = "crates/tenko/src/call.rs"

# webhook の送信 (署名・再送・配信の記録。tests/deliver_db.rs が偽物の HTTP で通す。W7b)
[[files]]
path = "crates/tenko/src/deliver.rs"

# 予定超過の確認 (印を先に付けて送る。tests/overdue_db.rs が実 DB と偽物の HTTP で通す。W7c)
[[files]]
path = "crates/tenko/src/overdue.rs"

# ほかの worker から webhook を預かる口 (`/internal/webhooks/fire`。tests/fire_db.rs)
[[files]]
path = "crates/tenko/src/fire.rs"

# 点呼の届出・認定申請に差し込む値 (事業者ごとに 1 行。tests/filing_db.rs)
[[files]]
path = "crates/tenko/src/filing.rs"

# 点呼の届出の申請データ (zip) の保管 (tests/filing_archives_db.rs がモックの置き場で通す。worker の R2 の実装 src/r2.rs は
# wasm 専用で対象外)
[[files]]
path = "crates/tenko/src/filing_archives.rs"

# 点呼の事業者と営業所の振り分け (tests/companies_db.rs。Refs ippoan/alc-app#676)
[[files]]
path = "crates/tenko/src/companies.rs"

# 点呼の受委託 (tests/consignments_db.rs。Refs ippoan/alc-app#676)
[[files]]
path = "crates/tenko/src/consignments.rs"

# 点呼の営業所と、運行管理者・車両の所属 (tests/offices_db.rs)
[[files]]
path = "crates/tenko/src/offices.rs"

# 点呼の異常のメール (宛先の SQL・件名と本文・送信。tests/mail_db.rs と tests/overdue_db.rs が偽物の送り手で通す。
# worker の送り手 src/mail.rs は wasm 専用で対象外。Refs ippoan/alc-app#676)
[[files]]
path = "crates/tenko/src/mail.rs"
